name: ai-code-evaluation-suite

services:
  runner-image:
    image: ai-code-evaluator-runner:local
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
    command: ["python", "--version"]
    restart: "no"

  evaluator:
    build:
      context: .
      dockerfile: services/evaluator/Dockerfile
    environment:
      EVALUATOR_JOB_ROOT: /runner-jobs
      EVALUATOR_JOB_VOLUME: ai-code-evaluator-jobs
      EVALUATOR_RUNNER_IMAGE: ai-code-evaluator-runner:local
      EVALUATOR_CORS_ORIGINS: http://localhost:3000
      EVALUATOR_DB_URL: postgresql+asyncpg://evaluator:password@postgres:5432/evaluator
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-jobs:/runner-jobs
    depends_on:
      runner-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: evaluator
      POSTGRES_PASSWORD: password
      POSTGRES_DB: evaluator
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaluator -d evaluator"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mlflow-artifacts:/mlflow/artifacts

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_EVALUATOR_URL: http://localhost:8000
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      evaluator:
        condition: service_healthy

volumes:
  runner-jobs:
    name: ai-code-evaluator-jobs
  postgres-data:
  mlflow-artifacts:

